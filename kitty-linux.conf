# Linux-only kitty shortcuts, mirroring the macOS cmd+ maps in kitty.conf.
# to include in kitty's configuration:
# include /home/ducmtran/Code/d-is-for-delete/kitty-linux.conf

map alt+t       launch --type=tab --cwd=~/Code
map alt+n       launch --type=os-window --cwd=~/Code

map alt+d       launch --cwd=current
map alt+shift+d launch --cwd=current --location=hsplit
map alt+w       close_window
